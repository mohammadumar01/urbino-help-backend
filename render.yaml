# Render Blueprint: backend API (free web service). Database: Neon (DATABASE_URL), cache: Upstash Redis (REDIS_URL).
# Render dashboard -> New -> Blueprint -> is repo ko chuno. Secrets dashboard mein bharo (sync: false).
services:
  - type: web
    name: urbino-help-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DB_POOL_MAX
        value: "10"
      - key: DB_SSL
        value: "true"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_DEMO_MODE
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: DEMO_PASSWORD
        sync: false
