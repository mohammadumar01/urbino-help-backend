# Passwords yahan nahi likhte. Ye .env file se aate hain (DB_PASSWORD, JWT_SECRET ...).
# .env.example copy karke .env banao.
services:

  backend:
    build: .
    container_name: urbino-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "7000:5500"
    environment:
      PORT: 5500
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5500/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:18
    container_name: urbino-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-Urbino_help}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: urbino-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6000:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
